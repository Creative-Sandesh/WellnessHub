<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .emergency-container {
  max-width: 400px;
  margin: 50px auto;
  padding: 2rem;
  background: #fff7ed;
  border-left: 5px solid #f97316;
  border-radius: 1rem;
  box-shadow: 0 6px 15px rgba(0,0,0,0.08);
  text-align: center;
  font-family: 'Segoe UI', sans-serif;
}

.emergency-container h2 {
  color: #c2410c;
  margin-bottom: 1rem;
}

.call-btn {
  display: inline-block;
  padding: 1rem 2rem;
  background: #ef4444;
  color: #fff;
  font-weight: 600;
  text-decoration: none;
  border-radius: 0.8rem;
  transition: background 0.3s ease;
}

.call-btn:hover {
  background: #b91c1c;
}

    </style>
</head>
<body>
    <div class="emergency-container">
  <h2>Emergency Contacts</h2>
  <p>Immediate help is available 24/7 for urgent mental health concerns.</p>

  <!-- Single Call Now button -->
  <a href="tel:9769838570" class="call-btn">Call Now</a>
</div>

</body>
</html>
